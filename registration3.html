<!DOCTYPE html>
<html >
<head>
          <link rel="stylesheet" href="style.css">
    <title>Registration</title>
</head>
<body>
       <div class="container-fluid">

<p style="color: brown;">please fill the form to Registration in <span style="font-weight: bold;">Effective Communication Skills Course</span>.</p>
<form>
    <fieldset >
        <legend style="color: brown; ">your informations</legend>
    First name:
    <input type="text" id="idd1">
   <span id="spann1" style="color: red; font-size: small;"></span>
    <br>    <br>

    Last name:
    <input type="text" name="Last" id="id2">
        <span id="span2" style="color: red; font-size: small;"></span>
    <br>    <br>

     Major:
    <input type="text" name="major" id="id3">
        <span id="span3" style="color: red; font-size: small;"></span>
    <br>    <br>

    University:
    <input type="text" name="university" id="id4">
    <span id="span4" style="color: red ; font-size: small;"></span>
    <br>    <br>

    Age:
    <input type="number" name="age" id="id5">
        <span id="span5" style="color: red; font-size: small;"></span>
    <br>    <br>

   
    Gender:
    <br>
    <input type="radio" name="gender" value="male">Male
    <br>
    <input type="radio" name="gender" value="female">Female
    <br>
    <span id="span6" style="color: red; font-size: small;"></span>
    <br>
<input type="button" value="submit" style="font-size: 20px;" onclick="clickk1()">
</fieldset>
</form>

    <p>Return to <a href="Workshops & Events.html" target="_blank">workshop & events.</a></p>
       </div>
    <script>
           
function clickk1(){
    var first=document.getElementById("idd1").value;
     var last=document.getElementById("id2").value;
        var major=document.getElementById("id3").value;             
        var uni=document.getElementById("id4").value;
        var age=document.getElementById("id5").value;
        var gender=document.getElementsByName("gender");
        var gen='';
        var con=true;
        for(i=0;i<gender.length;i++){
            if(gender[i].checked){
                gen +=gender[i].value;
                break;
            }
        }
    if(first==''){
        document.getElementById("spann1").innerHTML="please write your first name"; 
        con=false;   
    }
    if(last==''){
        document.getElementById("span2").innerHTML="please write your last name"; 
                con=false;   
  
    }
    if(major==''){
        document.getElementById("span3").innerHTML="please write your major";    
                con=false;   

    }
    if(uni==''){
        document.getElementById("span4").innerHTML="please write your university";  
                con=false;   
  
    }
    if(age<17 || age>26 ||age==NaN){
        document.getElementById("span5").innerHTML="your age must be between 17 and 26";   
                con=false;   
 
    }
    if(gen==''){
        document.getElementById("span6").innerHTML="please choose your gender";  
                con=false;   
  
    }
    while(con){
  
document.getElementById("spann1").innerHTML='';
document.getElementById("span2").innerHTML='';
document.getElementById("span3").innerHTML='';
document.getElementById("span4").innerHTML='';
document.getElementById("span5").innerHTML='';
document.getElementById("span6").innerHTML='';


        alert(first+", thank you for registralion , wish you all the best !!");
        con=false;
    }
}
 
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

</body>
</html>
