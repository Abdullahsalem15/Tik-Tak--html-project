    <p id="date"></p>
    <h2>Time Management Self-Check</h2>

    <form onsubmit="return validate()">


        <label>How focused were you today?</label><br>
        <select id="f">
            <option value="">Select</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select><br>
        <span class="error" id="errorf"></span>
        <br>

        <label>Hours you planned to work:</label><br>
        <input type="number" id="pn"><br>
        <span class="error" id="errorpl"></span>
        <br>


        <label>Hours you actually worked:</label><br>
        <input type="number" id="a"><br>
        <span class="error" id="errora"></span>
        <br>

        <label>Did you achieve your main targets today?</label><br>
        <input type="radio" name="priority" value="Yes, everything">Yes<br>
        <input type="radio" name="priority" value="Some of them">Some of them<br>
        <input type="radio" name="priority" value="No">No<br>
        <span class="error" id="errorpr" color="red"></span>
        <br>


        <label>What helped you stay on track?</label><br>
        <input type="checkbox" name="help" value="Planning ahead">Planning ahead<br>
        <input type="checkbox" name="help" value="Setting time slots">Setting time slots<br>
        <input type="checkbox" name="help" value="Taking pauses">Taking pauses<br>
        <input type="checkbox" name="help" value="None">None<br>
        <span class="error" id="errorh"></span>
        <br>

        <button type="submit">Review My Performance</button>

        <br><br>

        <textarea id="txtarea" rows="5" cols="100"></textarea>

    </form>





</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"crossorigin="anonymous"></script>

    <script>
        var d = new Date();
        document.getElementById("date").innerHTML = "The date and time is: " + d.getFullYear() + " / " + d.getMonth() + 1 + " / " + d.getDate() + " | " + d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();
        function validate() {
            var valid = true;



          
            document.getElementById("errorf").innerHTML = "";
            document.getElementById("errorpl").innerHTML = "";
            document.getElementById("errora").innerHTML = "";
            document.getElementById("errorpr").innerHTML = "";
            document.getElementById("errorh").innerHTML = "";

            var focus = document.getElementById("f").value;
            var planned = document.getElementById("pn").value;
            var actual = document.getElementById("a").value;




            if (focus === "") {
                document.getElementById("errorf").innerHTML = "Please select your focus level.";
                valid = false;
            }

            if (planned < 0) {
                document.getElementById("errorpl").innerHTML = "Please enter planned hours (0 or more).";
                valid = false;
            }

            if (actual < 0) {
                document.getElementById("errora").innerHTML = "Please enter actual hours (0 or more).";
                valid = false;
            }

            var priorities = document.getElementsByName("priority");
            var prioritySelected = "";
            for (let i = 0; i < priorities.length; i++) {
                if (priorities[i].checked) {
                    prioritySelected = priorities[i].value;
                }
            }

            if (prioritySelected === "") {
                document.getElementById("errorpr").innerHTML = "Please select an option.";
                valid = false;
            }

            if (planned === "" || planned < 0) {
                document.getElementById("errorpl").innerHTML = "Please enter planned hours (0 or more).";
                valid = false;
            }

            if (actual === "" || actual < 0) {
                document.getElementById("errora").innerHTML = "Please enter actual hours (0 or more).";
                valid = false;
            }

            var helps = document.getElementsByName("help");
            var helpselected = "";
            for (var i = 0; i < helps.length; i++) {
                if (helps[i].checked) {
                    if (helps[i].value === "None") {
                        helpselected = "None";
                        break;
                    } else {
                        helpselected += helps[i].value + ", ";
                    }
                }
            }



            if (helpselected === "") {
                document.getElementById("errorh").innerHTML = "Please select at least one.";
                valid = false;
            }


            if (valid) {
                var difference = actual - planned;
                var m = "";

                if (difference > 0) {
                    m = "Great! You worked more than planned.";
                } else if (difference < 0) {
                    m = "Try to improve your consistency tomorrow.";
                } else {
                    m = "Perfect balance!";
                }

                var ans = "Focus Level: " + focus + "\n" + "Planned Hours: " + planned + "\n"
                    + "Actual Hours: " + actual + "\n"
                    + "Priorities Completed: " + prioritySelected + "\n"
                    + "Helped By: " + helpselected + "\n"
                    + "Difference  in Time: " + difference + " hours\n"
                    + "message: " + m;

                document.getElementById("txtarea").value = ans;
            }

            return false;
        }

    </script>

</body>
